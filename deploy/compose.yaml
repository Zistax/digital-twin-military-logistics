services:
  demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - demo-runtime:/app/runtime
    environment:
      DEMO_PUBLIC_ORIGIN: "http://127.0.0.1:8080"
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  demo-runtime:
